<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NABD — Medical Centre Management | Doha, Qatar</title>
<style>
:root{
  --paper:#F6F7F5; --surface:#FFFFFF; --ink:#0F2A26; --ink-2:#4A615B; --ink-3:#7D908B;
  --maroon:#8A1538; --maroon-dk:#6B1029; --maroon-soft:#F7E9ED;
  --teal:#0F6E6B; --teal-soft:#E4F0EF;
  --amber:#B26A00; --amber-soft:#FBF0DE;
  --line:#DDE3E0; --line-2:#EDF0EE;
  --ok:#1F7A44; --bad:#B3261E; --bad-soft:#FBE9E7;
  --r:6px; --sp:16px;
  --fs-sans: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--fs-sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
body[dir="rtl"]{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
a{color:var(--maroon)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#DDE8E5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.10)}
.brand .mark{display:flex;align-items:baseline;gap:8px}
.brand .word{font-size:21px;font-weight:700;letter-spacing:.16em;color:#fff}
.brand .ar{font-size:16px;color:#8FB3AC}
.brand .sub{font-size:11px;color:#7E9A94;margin-top:5px;line-height:1.4}
.nav{padding:10px 0;overflow-y:auto;flex:1}
.nav .grp{font-size:10.5px;letter-spacing:.11em;color:#6E8B85;padding:14px 18px 6px;text-transform:uppercase}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:#C6D8D4;
  padding:8px 18px;cursor:pointer;text-align:start;font-size:13.5px;border-inline-start:3px solid transparent
}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(255,255,255,.09);color:#fff;border-inline-start-color:var(--maroon);font-weight:600}
.nav .tag{margin-inline-start:auto;background:var(--maroon);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:600}
.railfoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.10);font-size:11.5px;color:#7E9A94}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);padding:11px 22px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap
}
.topbar .clock{font-size:12.5px;color:var(--ink-2)}
.spacer{margin-inline-start:auto}
.chip{
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12.5px;background:#fff;cursor:pointer
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.view{padding:22px;max-width:1240px;width:100%}

/* ---------- generic ---------- */
.pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead p{margin:3px 0 0;color:var(--ink-2);font-size:13px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>header{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card>header h3{flex:1}
.card .body{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);
  padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:500
}
.btn:hover{background:#17403A}
.btn.primary{background:var(--maroon);border-color:var(--maroon)}
.btn.primary:hover{background:var(--maroon-dk)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}

label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff
}
input:focus,select:focus,textarea:focus{border-color:var(--ink-2);outline:none;box-shadow:0 0 0 3px rgba(15,42,38,.07)}
.field{margin-bottom:12px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.err{font-size:11.5px;color:var(--bad);margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover{background:var(--line-2)}
td.r,th.r{text-align:end}

.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.maroon{background:var(--maroon-soft);color:var(--maroon)}
.pill.grey{background:var(--line-2);color:var(--ink-2)}
.pill.ok{background:#E4F2E9;color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lab{font-size:12px;color:var(--ink-2)}
.kpi .val{font-size:26px;font-weight:650;margin-top:5px;letter-spacing:-.02em}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.kpi.teal .val{color:var(--teal)} .kpi.amber .val{color:var(--amber)} .kpi.maroon .val{color:var(--maroon)}

/* ---------- journey ribbon (the spine) ---------- */
.ribbon{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.ribbon .stg{flex:1;padding:11px 10px 11px 22px;position:relative;min-width:0;border-inline-end:1px solid var(--line-2)}
body[dir="rtl"] .ribbon .stg{padding:11px 22px 11px 10px}
.ribbon .stg:last-child{border-inline-end:0}
.ribbon .stg .n{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.ribbon .stg .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon .stg::before{content:"";position:absolute;inset-inline-start:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--line);}
.ribbon .stg.done{background:var(--teal-soft)}
.ribbon .stg.done::before{background:var(--teal)}
.ribbon .stg.done .t{color:var(--teal)}
.ribbon .stg.now{background:var(--maroon)}
.ribbon .stg.now::before{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28)}
.ribbon .stg.now .t{color:#fff} .ribbon .stg.now .n{color:rgba(255,255,255,.72)}

/* ---------- split bill bars ---------- */
.splitbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line-2)}
.splitbar i{display:block;height:100%}
.splitbar i.ins{background:var(--teal)} .splitbar i.pat{background:var(--amber)}
.legend{display:flex;gap:16px;font-size:12px;margin-top:8px;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.money.ins{color:var(--teal)} .money.pat{color:var(--amber)}
.tot{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.tot.big{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:17px;font-weight:650}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,42,38,.45);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:var(--surface);border-radius:8px;max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(15,42,38,.28)}
.modal>header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface)}
.modal>header h2{flex:1}
.modal .body{padding:20px}
.modal>footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:0 4px}

.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);z-index:90;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center;background:#fff;cursor:pointer;font-size:13px}
.slot:hover{border-color:var(--maroon);color:var(--maroon)}
.slot.taken{background:var(--line-2);color:var(--ink-3);cursor:not-allowed;text-decoration:line-through}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline>*{flex:1;min-width:130px}
.note{background:var(--teal-soft);border-inline-start:3px solid var(--teal);padding:10px 13px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;color:#12403E}
.note.warn{background:var(--amber-soft);border-color:var(--amber);color:#6E4300}
.note.stop{background:var(--bad-soft);border-color:var(--bad);color:#7C1D16}
.mini{font-size:12px;color:var(--ink-2)}
.rowline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.rowline:last-child{border-bottom:0}
@media print{.rail,.topbar,.noprint{display:none!important}.app{grid-template-columns:1fr}.view{padding:0}}
</style>
</head>

/* ------------------------- operations (the flow) ------------------------- */
function registerPatient(data) {
  const mrn = E.nextMRN(DB.seq.mrn++);
  const p = Object.assign({ mrn, created: TODAY, stage: "registered" }, data);
  DB.patients.push(p);
  return p;
}

function bookAppointment(mrn, doctorId, date, time) {
  const a = { id: "APT-" + String(DB.seq.appt++).padStart(4, "0"), mrn, doctorId, date, time, status: "booked" };
  DB.appointments.push(a);
  const v = {
    id: "V-" + String(DB.seq.visit++).padStart(5, "0"),
    mrn, doctorId, deptId: doc(doctorId).dept, date, time, apptId: a.id,
    stage: "booked", vitals: {}, complaint: "", notes: "", dx: [], items: [],
    bill: null, payments: [], claimId: null, checkedInAt: null, calledAt: null
  };
  DB.visits.push(v);
  a.visitId = v.id;
  return v;
}

function checkIn(v) {
  v.stage = "checked_in";
  v.checkedInAt = new Date().toTimeString().slice(0, 5);
  const a = DB.appointments.find(x => x.id === v.apptId); if (a) a.status = "arrived";
  /* eligibility is verified at the door, not at the till */
  const p = pt(v.mrn);
  const pl = p.insurance ? planOf(p.insurance.insurerId, p.insurance.plan) : null;
  v.eligibility = E.checkEligibility(p.insurance, pl, TODAY);
  return v;
}

function callPatient(v) { v.stage = "in_consult"; v.calledAt = new Date().toTimeString().slice(0, 5); return v; }

function addItem(v, code, qty) {
  const s = svc(code); if (!s) return;
  const ex = v.items.find(i => i.code === code);
  if (ex) { ex.qty += (qty || 1); return; }
  v.items.push({ code, name: s.en, nameAr: s.ar, type: s.type, price: s.price, qty: qty || 1, approved: false });
}

function buildBill(v) {
  const p = pt(v.mrn);
  const pl = p.insurance ? planOf(p.insurance.insurerId, p.insurance.plan) : null;
  const elig = v.eligibility ? v.eligibility.eligible : (p.insurance ? E.checkEligibility(p.insurance, pl, TODAY).eligible : false);
  return E.splitBill({
    items: v.items.map(i => ({ code: i.code, name: L({ en: i.name, ar: i.nameAr }), type: i.type, price: i.price, qty: i.qty, approved: i.approved })),
    plan: pl, eligible: elig,
    usage: p.insurance ? { deductibleUsed: p.insurance.deductibleUsed || 0, limitUsed: p.insurance.limitUsed || 0 } : {}
  });
}

function sendToCashier(v) { v.stage = "ready_to_bill"; v.bill = buildBill(v); return v; }

function collect(v, method, tendered) {
  const b = v.bill || buildBill(v);
  const p = pt(v.mrn);
  const paid = E.round2(Math.min(tendered == null ? b.totals.patient : tendered, b.totals.patient));
  v.payments.push({ date: TODAY, method, amount: paid, ref: "RCT-" + v.id.slice(2) });
  DB.payments.push({ date: TODAY, visitId: v.id, mrn: v.mrn, method, amount: paid, deptId: v.deptId, doctorId: v.doctorId });
  v.stage = "paid"; v.billedAt = TODAY; v.bill = b;

  if (p.insurance && b.totals.insurance > 0) {           // insurer usage is consumed at billing
    p.insurance.deductibleUsed = b.usageAfter.deductibleUsed;
    p.insurance.limitUsed = b.usageAfter.limitUsed;
  }
  post(v.id, "Visit billing — " + v.mrn,
       E.postingsForBill({ gross: b.totals.gross, insurance: b.totals.insurance,
                           patient: b.totals.patient, patientPaid: paid, method }), TODAY);

  if (b.totals.insurance > 0 && p.insurance) {
    const c = { id: "CLM-" + String(DB.seq.claim++).padStart(4, "0"), visitId: v.id, mrn: v.mrn,
                insurerId: p.insurance.insurerId, plan: p.insurance.plan, policyNo: p.insurance.policyNo,
                amount: b.totals.insurance, status: "draft", created: TODAY, submitted: null,
                settled: 0, rejectReason: "", dx: v.dx.slice() };
    DB.claims.push(c); v.claimId = c.id;
  }
  return v;
}

function submitClaim(c) { c.status = "submitted"; c.submitted = TODAY; const v = visit(c.visitId); if (v) v.stage = "claimed"; }

function settleClaim(c, settled, reason) {
  const s = E.round2(settled);
  c.settled = s;
  c.status = s <= 0 ? "rejected" : (s < c.amount ? "part" : "paid");
  c.rejectReason = reason || "";
  c.settledOn = TODAY;
  post(c.id, "Insurer settlement — " + (insurer(c.insurerId) || {}).en, E.postingsForSettlement(c.amount, s), TODAY);
}

    [5, "D4", ["CON-SPC", "DEN-FIL"], 48, "card"],
    [3, "D1", ["CON-GP", "PRC-DRS"], 55, "cash"],
    [0, "D5", ["CON-GP", "VAC-FLU"], 62, "card"]
  ];
  hist.forEach(h => {
    const p = DB.patients[h[0]], d = h[1], codes = h[2], ago = h[3], method = h[4];
    const date = daysAgo(ago);
    const v = bookAppointment(p.mrn, d, date, "09:00");
    v.date = date; v.stage = "in_consult";
    const pl = p.insurance ? planOf(p.insurance.insurerId, p.insurance.plan) : null;
    v.eligibility = E.checkEligibility(p.insurance, pl, date);
    codes.forEach(c => addItem(v, c, 1));
    v.items.forEach(i => { i.approved = true; });
    v.dx = [DB.icd10[ago % DB.icd10.length].code];
    sendToCashier(v); collect(v, method, null);
    v.billedAt = date;
    DB.payments[DB.payments.length - 1].date = date;
    DB.journal[DB.journal.length - 1].date = date;
    if (v.claimId) {
      const c = DB.claims.find(x => x.id === v.claimId);
      c.created = date;
      if (ago > 7) { submitClaim(c); c.submitted = date; }
      if (ago > 35) { const short = ago > 55 ? c.amount * 0.12 : 0;
        settleClaim(c, E.round2(c.amount - short), short ? "Service LAB-LFT outside plan schedule" : "");
        c.settledOn = daysAgo(ago - 28);
        DB.journal[DB.journal.length - 1].date = c.settledOn; }
    }
  });

  /* today's floor: one of each stage so the journey is visible immediately */
  const t1 = bookAppointment(DB.patients[1].mrn, "D1", TODAY, "09:00"); checkIn(t1);
  const t2 = bookAppointment(DB.patients[2].mrn, "D4", TODAY, "09:20"); checkIn(t2);
  const t3 = bookAppointment(DB.patients[5].mrn, "D1", TODAY, "09:40"); checkIn(t3); callPatient(t3);
  addItem(t3, "CON-GP", 1); addItem(t3, "LAB-CBC", 1);
  const t4 = bookAppointment(DB.patients[0].mrn, "D3", TODAY, "10:00"); checkIn(t4); callPatient(t4);
  addItem(t4, "CON-DEN", 1); addItem(t4, "DEN-RCT", 1);
  t4.dx = ["K02.9"]; t4.complaint = "Pain in lower right molar for four days";
  sendToCashier(t4);
  bookAppointment(DB.patients[4].mrn, "D7", TODAY, "16:20");
  bookAppointment(DB.patients[6].mrn, "D5", TODAY, "17:00");
}

/* ------------------------- finance ------------------------- */
function viewFinance() {
  const from = VIEW.finFrom, to = VIEW.finTo;
  const inRange = d => d >= from && d <= to;
  const pays = DB.payments.filter(p => inRange(p.date));
  const visits = DB.visits.filter(v => v.billedAt && inRange(v.billedAt) && v.bill);
  const gross = sum(visits, v => v.bill.totals.gross);
  const insShare = sum(visits, v => v.bill.totals.insurance);
  const collected = sum(pays, p => p.amount);

  const byMethod = ["cash", "card", "naps", "transfer"].map(m => {
    const a = sum(pays.filter(p => p.method === m), p => p.amount);
    return { m, a, n: pays.filter(p => p.method === m).length };
  });
  const maxM = Math.max(1, ...byMethod.map(x => x.a));

  const byDept = DB.departments.map(d => {
    const vs = visits.filter(v => v.deptId === d.id);
    const amt = sum(vs, v => sum(v.bill.lines.filter(l => (svc(l.code) || {}).dept === d.id || v.deptId === d.id), l => l.gross));
    return { d, amt, n: vs.length };
  }).filter(x => x.amt > 0).sort((a, b) => b.amt - a.amt);
  const maxD = Math.max(1, ...byDept.map(x => x.amt));

  const byDoc = DB.doctors.map(dc => {
    const vs = visits.filter(v => v.doctorId === dc.id);
    return { dc, amt: sum(vs, v => v.bill.totals.gross), n: vs.length };
  }).filter(x => x.amt > 0).sort((a, b) => b.amt - a.amt);

  const openClaims = DB.claims.filter(c => c.status === "submitted" || c.status === "draft" || c.status === "part");
  const buckets = { "0-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };
  openClaims.forEach(c => {
    const d = E.daysBetween(c.submitted || c.created, TODAY);
    buckets[E.agingBucket(d)] += (c.amount - (c.settled || 0));
  });
  const totalRecv = sum(Object.keys(buckets), k => buckets[k]);

  const jrows = DB.journal.filter(j => inRange(j.date)).slice().reverse().slice(0, 40).map(j =>
    j.lines.map((l, n) => "<tr>" + (n === 0 ? '<td rowspan="' + j.lines.length + '" class="num">' + esc(j.date) +
      '<div class="mini">' + esc(j.id) + "</div></td><td rowspan=\"" + j.lines.length + '"><div class="mini">' + esc(j.memo) +
      "</div>" + esc(j.ref) + "</td>" : "") +
      '<td><span class="num mini">' + esc(l.acc.code) + "</span> " + esc(L(l.acc)) + '</td><td class="r num">' +
      (l.dr ? qar(l.dr) : "") + '</td><td class="r num">' + (l.cr ? qar(l.cr) : "") + "</td></tr>").join("")).join("");

  const bar = (label, val, max, cls, note) =>
    '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px">' +
    "<span>" + esc(label) + '</span><span class="num money">' + qar(val) + "</span></div>" +
    '<div style="height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-top:4px">' +
    '<i style="display:block;height:100%;width:' + Math.max(2, val / max * 100) + "%;background:var(--" + cls + ')"></i></div>' +
    (note ? '<div class="mini">' + esc(note) + "</div>" : "") + "</div>";

  return head("f_t", "f_s") +
    '<div class="card noprint" style="margin-bottom:16px"><div class="body"><div class="inline">' +
      '<div><label>' + esc(LANG === "ar" ? "من" : "From") + '</label><input type="date" data-act="fin-from" value="' + from + '"></div>' +
      '<div><label>' + esc(LANG === "ar" ? "إلى" : "To") + '</label><input type="date" data-act="fin-to" value="' + to + '"></div>' +
      '<div style="flex:3"></div><div><button class="btn ghost" data-act="print">' + esc(T("print")) + "</button></div>" +
    "</div></div></div>" +
    '<div class="grid g4" style="margin-bottom:16px">' +
      '<div class="kpi"><div class="lab">' + esc(LANG === "ar" ? "إجمالي الإيراد" : "Gross revenue") + '</div><div class="val num">' + qar(gross) +
        '</div><div class="foot num">' + visits.length + (LANG === "ar" ? " زيارة مفوترة" : " billed visits") + "</div></div>" +
      '<div class="kpi teal"><div class="lab">' + esc(LANG === "ar" ? "محصّل نقداً/بطاقة" : "Collected from patients") + '</div><div class="val num">' + qar(collected) +
        '</div><div class="foot num">' + pays.length + (LANG === "ar" ? " إيصال" : " receipts") + "</div></div>" +
      '<div class="kpi amber"><div class="lab">' + esc(LANG === "ar" ? "محمّل على التأمين" : "Billed to insurers") + '</div><div class="val num">' + qar(insShare) +
        '</div><div class="foot">' + esc(Math.round(gross ? insShare / gross * 100 : 0) + "% " + (LANG === "ar" ? "من الإيراد" : "of revenue")) + "</div></div>" +
      '<div class="kpi maroon"><div class="lab">' + esc(T("k_recv")) + '</div><div class="val num">' + qar(totalRecv) +
        '</div><div class="foot num">' + openClaims.length + (LANG === "ar" ? " مطالبة مفتوحة" : " open claims") + "</div></div>" +
    "</div>" +
    '<div class="grid g3">' +
      '<div class="card"><header><h3>' + esc(T("f_collect")) + '</h3></header><div class="body">' +
        byMethod.map(x => bar(T("b_" + x.m), x.a, maxM, "teal", x.n + (LANG === "ar" ? " عملية" : " transactions"))).join("") + "</div></div>" +
      '<div class="card"><header><h3>' + esc(T("f_revdept")) + '</h3></header><div class="body">' +
        (byDept.length ? byDept.map(x => bar(L(x.d), x.amt, maxD, "maroon", x.n + (LANG === "ar" ? " زيارة" : " visits"))).join("")
         : '<div class="mini">' + esc(T("none")) + "</div>") + "</div></div>" +
      '<div class="card"><header><h3>' + esc(T("f_aging")) + '</h3></header><div class="body">' +
        Object.keys(buckets).map(k => bar(k + (LANG === "ar" ? " يوم" : " days"), buckets[k], Math.max(1, ...Object.values(buckets)), "amber")).join("") +
      "</div></div>" +
    "</div>" +
    '<div class="grid g2" style="margin-top:16px">' +
      '<div class="card"><header><h3>' + esc(T("f_revdoc")) + "</h3></header>" +
        (byDoc.length ? "<table><thead><tr><th>" + esc(T("dr_of")) + "</th><th>" + esc(T("ap_dept")) + '</th><th class="r">' +
         esc(LANG === "ar" ? "زيارات" : "Visits") + '</th><th class="r">' + esc(T("amount")) + "</th></tr></thead><tbody>" +
         byDoc.map(x => "<tr><td>" + esc(L(x.dc)) + "</td><td>" + esc(L(dept(x.dc.dept))) + '</td><td class="r num">' + x.n +
         '</td><td class="r money num">' + qar(x.amt) + "</td></tr>").join("") + "</tbody></table>"
         : '<div class="empty">' + esc(T("none")) + "</div>") + "</div>" +
      '<div class="card"><header><h3>' + esc(T("f_journal")) + '</h3><span class="mini">' +
        esc(LANG === "ar" ? "قيود مزدوجة" : "double entry") + "</span></header>" +
        (jrows ? "<table><thead><tr><th>" + esc(T("date")) + "</th><th>" + esc(T("f_ref")) + "</th><th>" + esc(T("f_account")) +
         '</th><th class="r">' + esc(T("f_dr")) + '</th><th class="r">' + esc(T("f_cr")) + "</th></tr></thead><tbody>" + jrows + "</tbody></table>"
         : '<div class="empty">' + esc(T("none")) + "</div>") + "</div>" +
    "</div>";
}

    "<header><h2>" + esc(title) + '</h2><button class="x" data-act="close-modal">×</button></header>' +

}
function closeModal() { $("#modalHost").innerHTML = ""; }

      fld(T("pt_email"), '<input id="f_email" type="email">') + "</div>" +

function savePatient() {
  const val = id => ($("#" + id) ? $("#" + id).value.trim() : "");
  const errs = [];
  if (!val("f_en")) errs.push(LANG === "ar" ? "الاسم مطلوب" : "Name is required");
  const q = E.validateQID(val("f_qid")); if (!q.ok) errs.push(q.reason);
  const ph = E.validateQatarPhone(val("f_phone")); if (!ph.ok) errs.push(ph.reason);
  if (!val("f_dob")) errs.push(LANG === "ar" ? "تاريخ الميلاد مطلوب" : "Date of birth is required");
  const insId = val("f_ins");
  if (insId && !val("f_exp")) errs.push(LANG === "ar" ? "تاريخ انتهاء البطاقة مطلوب" : "Card expiry is required");
  if (errs.length) { $("#regErr").innerHTML = '<div class="note stop">' + errs.map(esc).join("<br>") + "</div>"; return; }

  const p = registerPatient({
    en: val("f_en"), ar: val("f_ar"), qid: val("f_qid"), healthCard: val("f_hc"), dob: val("f_dob"),
    sex: val("f_sex"), nationality: val("f_nat") || "—", phone: ph.normalised, email: val("f_email"),
    address: val("f_addr"),
    insurance: insId ? { insurerId: insId, plan: val("f_plan"), policyNo: val("f_pol"), cardNo: val("f_card"),
                         expiry: val("f_exp"), active: true, deductibleUsed: 0, limitUsed: 0 } : null
  });
  closeModal();
  toast((LANG === "ar" ? "تم التسجيل — " : "Registered — ") + p.mrn);
  go("patient", { mrn: p.mrn });
}

function pickPatientModal(time) {
  const opts = DB.patients.map(p => '<option value="' + p.mrn + '">' + esc(L(p)) + " — " + esc(p.mrn) + "</option>").join("");
  modal(T("ap_book") + " · " + time,
    fld(T("pt_of"), '<select id="bkMrn">' + opts + "</select>") +
    '<div class="note">' + esc(L(doc(VIEW.apptDoctor))) + " · " + esc(L(dept(doc(VIEW.apptDoctor).dept))) + " · " +
    esc(VIEW.apptDate) + " " + esc(time) + "</div>",

    '<button class="btn primary" data-act="do-book" data-t="' + time + '">' + esc(T("confirm")) + "</button>");
}

function settleModal(c) {
  modal(T("cl_settle") + " · " + c.id,
    minirow(T("cl_amount"), qar(c.amount)) + minirow(T("ins_company"), L(insurer(c.insurerId))) +

    fld(LANG === "ar" ? "سبب الخصم أو الرفض" : "Reason for any shortfall",

/* ------------------------- events ------------------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch (act) {
    case "go": go(el.dataset.v, el.dataset.clear ? { visitId: null, mrn: null } : {}); break;
    case "close-modal": if (e.target === el) closeModal(); break;
    case "new-pt": newPatientModal(); break;
    case "save-pt": savePatient(); break;
    case "open-pt": go("patient", { mrn: id }); break;
    case "book-for": go("appts", { mrn: id }); toast(LANG === "ar" ? "اختر وقتاً متاحاً" : "Pick a free slot"); break;
    case "pick-slot": {
      if (VIEW.mrn) { const v = bookAppointment(VIEW.mrn, VIEW.apptDoctor, VIEW.apptDate, el.dataset.t);
        VIEW.mrn = null; toast(T("ap_book") + " ✓ " + v.id); render(); }
      else pickPatientModal(el.dataset.t);
      break;
    }
    case "do-book": {
      const mrn = $("#bkMrn").value;
      const v = bookAppointment(mrn, VIEW.apptDoctor, VIEW.apptDate, el.dataset.t);
      closeModal(); toast(T("ap_book") + " ✓ " + v.id); render(); break;
    }
    case "checkin": { const v = visit(id); checkIn(v);
      toast(v.eligibility && v.eligibility.eligible ? T("ap_checkin") + " ✓ " + T("ins_eligible")
            : T("ap_checkin") + " ✓ " + T("noins"), v.eligibility && !v.eligibility.eligible);
      render(); break; }
    case "call": callPatient(visit(id)); go("consult", { visitId: id }); break;
    case "open-visit": {
      const v = visit(id); if (!v) break;
      if (v.stage === "in_consult") go("consult", { visitId: id });
      else if (v.stage === "ready_to_bill") go("billing", { visitId: id });
      else go("patient", { mrn: v.mrn });
      break;
    }
    case "add-dx": break;
    case "rm-dx": { const v = visit(VIEW.visitId); v.dx = v.dx.filter(x => x !== el.dataset.code); render(); break; }
    case "rm-item": { const v = visit(VIEW.visitId); v.items = v.items.filter(i => i.code !== el.dataset.code); render(); break; }
    case "to-cashier": { const v = visit(id); captureConsult(v); sendToCashier(v);
      toast(T("c_finish") + " ✓"); go("billing", { visitId: id }); break; }
    case "approve": { const v = visit(VIEW.visitId) || DB.visits.find(x => x.stage === "ready_to_bill");
      const it = v.items.find(i => i.code === el.dataset.code); if (it) it.approved = true;
      toast(T("approved") + " — " + el.dataset.code); VIEW.visitId = v.id; render(); break; }
    case "collect": {
      const v = visit(id);
      const method = $("#payMethod").value, tendered = parseFloat($("#payTendered").value);
      const due = v.bill.totals.patient;
      if (tendered < due - 0.004) { toast(LANG === "ar" ? "المبلغ أقل من المستحق" : "Amount received is less than the patient share", true); break; }
      collect(v, method, due);
      const change = E.round2(tendered - due);
      modal(T("b_receipt"), receipt(v) + (change > 0 ? '<div class="note" style="margin-top:10px">' + esc(T("b_change")) + ": " + esc(qar(change)) + "</div>" : ""),
        '<button class="btn ghost" data-act="print">' + esc(T("print")) + "</button>" +
        '<button class="btn primary" data-act="close-modal">' + esc(T("close")) + "</button>");
      VIEW.visitId = null; renderNav(); break;
    }
    case "print": window.print(); break;
    case "submit-claim": { submitClaim(DB.claims.find(c => c.id === id)); toast(T("cl_submit") + " ✓ " + id); render(); break; }
    case "settle-claim": settleModal(DB.claims.find(c => c.id === id)); break;
    case "do-settle": {
      const c = DB.claims.find(x => x.id === id);
      settleClaim(c, parseFloat($("#stAmt").value) || 0, $("#stWhy").value);
      closeModal(); toast(T("cl_settle") + " ✓ " + id); render(); break;
    }
  }
});

document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act;
  if (act === "set-doctor") { VIEW.apptDoctor = el.value; render(); }
  if (act === "set-date") { VIEW.apptDate = el.value; render(); }
  if (act === "fin-from") { VIEW.finFrom = el.value; render(); }
  if (act === "fin-to") { VIEW.finTo = el.value; render(); }
  if (act === "add-dx" && el.value) { const v = visit(VIEW.visitId) || DB.visits.find(x => x.stage === "in_consult");
    if (v && v.dx.indexOf(el.value) === -1) v.dx.push(el.value); VIEW.visitId = v.id; captureConsult(v); render(); }
  if (act === "add-svc" && el.value) { const v = visit(VIEW.visitId) || DB.visits.find(x => x.stage === "in_consult");
    captureConsult(v); addItem(v, el.value, 1); VIEW.visitId = v.id; render(); }
});

document.addEventListener("input", e => {
  if (e.target.dataset.act === "search") { VIEW.search = e.target.value; const pos = e.target.selectionStart;
    render(); const s = $("#ptSearch"); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  if (e.target.id === "f_qid") {
    const r = E.validateQID(e.target.value);
    const h = $("#qidHint"); if (h) { h.textContent = r.ok ? "✓ " + (LANG === "ar" ? "سنة الميلاد" : "birth year") + " " + r.birthYear : r.reason;
      h.className = r.ok ? "hint" : "err"; }
  }
});

function captureConsult(v) {
  if (!v) return;
  document.querySelectorAll("[data-vital]").forEach(i => { v.vitals[i.dataset.vital] = i.value; });
  document.querySelectorAll("[data-fld]").forEach(i => { v[i.dataset.fld] = i.value; });
}

$("#langBtn").addEventListener("click", () => {
  LANG = LANG === "en" ? "ar" : "en";
  document.body.dir = STR[LANG].dir; document.documentElement.lang = LANG; document.documentElement.dir = STR[LANG].dir;
  render();
});
$("#roleSel").addEventListener("change", e => {
  ROLE = e.target.value;
  const home = { admin: "dash", reception: "patients", doctor: "consult", cashier: "billing", finance: "finance" }[ROLE];
  go(home, { visitId: null });
});

/* ------------------------- new state ------------------------- */
DB.outbox = DB.outbox || [];
DB.stats = DB.stats || { consult: {} };
DB.gateway = DB.gateway || {
  provider: "Ooredoo Qatar — SMS API", sender: "ALNOOR",
  endpoint: "https://api.provider.qa/v1/messages", connected: false
};
DB.automation = DB.automation || {
  kiosk: true, booking: true, checkin: true, delay: true, next: true, bill: true,
  elig: true, appr: true, claim: true, resubmit: true, noshow: true,
  delayThreshold: 15, noShowMinutes: 20
};
const AR_NAT = ["Qatari","Egyptian","Sudanese","Syrian","Jordanian","Lebanese","Palestinian","Yemeni",
                "Moroccan","Tunisian","Algerian","Saudi","Emirati","Kuwaiti","Bahraini","Omani","Iraqi"];
const patLang = p => p.lang || (AR_NAT.indexOf(p.nationality) !== -1 ? "ar" : "en");
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* ------------------------- messaging ------------------------- */
function notify(mrn, key, vars, force) {
  const p = pt(mrn); if (!p || !p.phone) return null;
  const lang = patLang(p);
  const body = E.renderTemplate(key, lang, Object.assign({
    name: (lang === "ar" && p.ar ? p.ar : p.en).split(" ")[0],
    centre: lang === "ar" ? DB.centre.ar : DB.centre.en
  }, vars || {}));
  if (!body) return null;
  const seg = E.smsParts(body);
  const m = { id: "MSG-" + (DB.outbox.length + 1001), at: new Date().toTimeString().slice(0, 5),
              date: TODAY, mrn, to: p.phone, channel: DB.automation.channel || "sms", key, lang,
              body, parts: seg.parts, encoding: seg.encoding, status: "queued", ref: "" };
  DB.outbox.push(m);
  dispatch(m);
  return m;
}
/* The only place a real gateway call would go. Swap the body of this function
   for a fetch() to the provider and nothing else in the system changes.      */
function dispatch(m) {
  if (!DB.gateway.connected) { m.status = "queued"; return; }
  m.status = "sent"; m.ref = "PRV-" + Math.random().toString(36).slice(2, 9).toUpperCase();
}
function sendQueued() {
  const q = DB.outbox.filter(m => m.status === "queued");
  q.forEach(m => { m.status = "sent"; m.ref = "PRV-" + Math.random().toString(36).slice(2, 9).toUpperCase(); });
  return q.length;
}

/* ------------------------- doctor status ------------------------- */
function avgConsult(docId) {
  const a = DB.stats.consult[docId];
  if (!a || !a.length) return 15;
  return Math.max(6, Math.round(a.reduce((s, x) => s + x, 0) / a.length));
}
function doctorStatus(docId) {
  const waiting = DB.visits.filter(v => v.doctorId === docId && v.date === TODAY && v.stage === "checked_in")
    .sort((a, b) => (a.checkedInAt || a.time).localeCompare(b.checkedInAt || b.time));
  const cur = DB.visits.find(v => v.doctorId === docId && v.date === TODAY && v.stage === "in_consult");
  const r = E.predictQueue({
    nowMinutes: nowMin(), avgConsultMinutes: avgConsult(docId),
    current: cur ? { startedAt: cur.calledAt } : null,
    waiting: waiting.map(v => ({ id: v.id, scheduled: v.time, arrived: v.checkedInAt }))
  });
  r.waitingVisits = waiting; r.current = cur; r.doctorId = docId;
  return r;
}

/* ------------------------- automation ------------------------- */
function runAutomations() {
  const A = DB.automation;

  DB.doctors.forEach(d => {
    const st = doctorStatus(d.id);
    st.queue.forEach((q, i) => {
      const v = visit(q.id); if (!v) return;
      v.notified = v.notified || {};
      if (A.delay && q.delayMinutes >= A.delayThreshold) {
        const bucket = Math.floor(q.delayMinutes / A.delayThreshold);
        if (v.notified.delayBucket !== bucket) {
          v.notified.delayBucket = bucket;
          notify(v.mrn, "doctor_delay", { doctor: L(d), delay: q.delayMinutes, eta: q.eta });
        }
      }
      if (A.next && i === 0 && !v.notified.next) {
        v.notified.next = true;
        notify(v.mrn, "you_are_next", { room: d.room, doctor: L(d) });
      }
    });
  });

  if (A.noshow) {
    DB.visits.filter(v => v.stage === "booked" && v.date === TODAY).forEach(v => {
      const sched = E.minutesOf(v.time);
      if (sched != null && nowMin() > sched + A.noShowMinutes) {
        v.stage = "no_show";
        const a = DB.appointments.find(x => x.id === v.apptId); if (a) a.status = "no_show";
        notify(v.mrn, "no_show", { time: v.time, doctor: L(doc(v.doctorId)) });
      }
    });
  }

  if (A.claim) DB.claims.filter(c => c.status === "draft").forEach(submitClaim);

  if (A.appr) {
    DB.visits.filter(v => v.stage === "ready_to_bill" && v.bill).forEach(v => {
      v.notified = v.notified || {};
      v.bill.pendingApprovals.forEach(pa => {
        const k = "appr_" + pa.code;
        if (!v.notified[k]) {
          v.notified[k] = true;
          v.approvals = v.approvals || [];
          v.approvals.push({ code: pa.code, amount: pa.amount, status: "requested", at: TODAY });
          notify(v.mrn, "approval_pending", { service: L(svc(pa.code)) });
        }
      });
    });
  }
}

const _book = bookAppointment;
bookAppointment = function (mrn, docId, date, time) {
  const v = _book(mrn, docId, date, time);
  if (DB.automation.booking) notify(mrn, "booked", {
    doctor: L(doc(docId)), dept: L(dept(doc(docId).dept)), date, time });
  return v;
};
const _checkIn = checkIn;
checkIn = function (v) {
  _checkIn(v);
  const st = doctorStatus(v.doctorId);
  const q = st.queue.find(x => x.id === v.id) || { position: st.queue.length, eta: "—" };
  v.ticket = "Q" + String(DB.visits.filter(x => x.date === TODAY && x.checkedInAt).length).padStart(3, "0");
  if (DB.automation.checkin) notify(v.mrn, "checked_in", { position: q.position, eta: q.eta });
  if (DB.automation.elig && v.eligibility && !v.eligibility.eligible)
    notify(v.mrn, "eligibility_failed", { reason: v.eligibility.reasons.map(reasonText).join(", ") });
  runAutomations();
  return v;
};
const _call = callPatient;
callPatient = function (v) {
  _call(v);
  notify(v.mrn, "called", { room: doc(v.doctorId).room, doctor: L(doc(v.doctorId)) });
  runAutomations();
  return v;
};
const _toCashier = sendToCashier;
sendToCashier = function (v) {
  _toCashier(v);
  if (v.calledAt) {
    const mins = Math.max(3, nowMin() - E.minutesOf(v.calledAt));
    (DB.stats.consult[v.doctorId] = DB.stats.consult[v.doctorId] || []).push(mins);
  }
  if (DB.automation.bill) notify(v.mrn, "bill_ready", {
    amount: qar(v.bill.totals.patient), link: "pay.alnoor.qa/" + v.id.toLowerCase() });
  runAutomations();
  return v;
};
const _collect = collect;
collect = function (v, method, tendered) {
  _collect(v, method, tendered);
  const last = v.payments[v.payments.length - 1];
  notify(v.mrn, "paid", { amount: qar(last.amount), ref: last.ref });
  runAutomations();
  return v;
};
const _settle = settleClaim;
settleClaim = function (c, amt, reason) {
  _settle(c, amt, reason);
  if (c.status === "rejected" && DB.automation.resubmit) c.resubmit = "queued";
  return c;
};

function scanResult(parsed) {
  SCAN.parsed = parsed;
  const out = $("#scanOut"); if (!out) return;
  const use = $("#scanUse");
  if (!parsed || !parsed.valid) {
    const failed = parsed && parsed.checks ? Object.keys(parsed.checks).filter(k => !parsed.checks[k]) : [];
    out.innerHTML = '<div class="note stop" style="margin-top:14px"><b>' + esc(T("scan_bad")) + "</b>" +
      (failed.length ? "<br>Check digit failed on: " + esc(failed.join(", ")) : "") + "</div>";
    if (use) use.disabled = true;

  const existing = findByDocument(parsed);
  out.innerHTML = '<div class="note" style="margin-top:14px"><b>' + esc(T("scan_ok")) + "</b> — " +
      esc(parsed.format) + " · " + Object.keys(parsed.checks).length + " check digits verified</div>" +

}

function nextFreeSlot(docId, date) {
  const taken = DB.visits.filter(v => v.doctorId === docId && v.date === date).map(v => v.time);
  const now = nowMin();
  return SLOT_TIMES.find(t => taken.indexOf(t) === -1 && E.minutesOf(t) >= now - 10) || SLOT_TIMES[0];
}
function leastBusyDoctor(deptId) {
  return DB.doctors.filter(d => d.dept === deptId)
    .map(d => ({ d, n: DB.visits.filter(v => v.doctorId === d.id && v.date === TODAY &&
        ["booked", "checked_in", "in_consult"].indexOf(v.stage) !== -1).length }))
    .sort((a, b) => a.n - b.n)[0].d;
}

function kioskScan(parsed) {
  const K = VIEW.kiosk; K.mrz = parsed;
  const existing = findByDocument(parsed);
  if (!existing) { K.stage = "mobile"; K.mrn = null; render(); return; }
  K.mrn = existing.mrn;
  const booked = DB.visits.find(v => v.mrn === existing.mrn && v.date === TODAY && v.stage === "booked");
  if (booked) { checkIn(booked); K.visitId = booked.id; K.stage = "done"; }
  else K.stage = "walkin";
  render();
}
function kioskWalkIn(deptId) {
  const K = VIEW.kiosk;
  const d = leastBusyDoctor(deptId);
  const v = bookAppointment(K.mrn, d.id, TODAY, nextFreeSlot(d.id, TODAY));
  checkIn(v); K.visitId = v.id; K.stage = "done"; render();
}

        fld(LANG === "ar" ? "اسم المرسل" : "Sender ID", '<input data-gw="sender" value="' + esc(g.sender) + '">') +
        fld("Endpoint", '<input data-gw="endpoint" value="' + esc(g.endpoint) + '">') + "</div>" +
      '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" data-gw="connected"' +
        (g.connected ? " checked" : "") + "> " + esc(LANG === "ar" ? "إرسال فوري عند التوصيل" : "Send immediately when connected") + "</label>" +
      '<div class="note" style="margin-top:12px">' + esc(T("a_gateway_note")) + "</div>" +
    "</div></div>" +
    '<div class="card">' + (rows ? "<table><thead><tr><th>" + esc(T("o_when")) + "</th><th>" + esc(T("o_to")) +
      "</th><th>" + esc(LANG === "ar" ? "السبب" : "Trigger") + "</th><th>" + esc(T("o_body")) + '</th><th class="r">' +
      esc(T("o_parts")) + "</th><th>" + esc(T("status")) + "</th></tr></thead><tbody>" + rows + "</tbody></table>"
      : '<div class="empty">' + esc(T("none")) + "</div>") + "</div>";
}

/* ------------------------- automation rules ------------------------- */
function boardCard() {
  const rows = DB.doctors.map(d => {
    const st = doctorStatus(d.id);
    const cls = { on_time: "teal", delayed: "amber", heavily_delayed: "bad" }[st.status];
    return "<tr><td>" + esc(L(d)) + '<div class="mini">' + esc(L(dept(d.dept))) + " · " + esc(T("k_room")) + " " + esc(d.room) +
      '</div></td><td><span class="pill ' + cls + '">' + esc(T("a_" + st.status)) + "</span></td>" +
      '<td class="r num">' + st.queue.length + " " + esc(T("a_waiting")) + '</td><td class="r num">' +
      (st.doctorDelayMinutes ? st.doctorDelayMinutes + "m " + esc(T("a_delay")) : "—") + '</td><td class="r num">' +
      (st.queue.length ? esc(st.queue[0].eta) : "—") + "</td><td class=\"r num mini\">" + avgConsult(d.id) + "m avg</td></tr>";
  }).join("");
  return '<div class="card"><header><h3>' + esc(T("a_board")) + '</h3><span class="mini">' +
    esc(LANG === "ar" ? "يُحدَّث تلقائياً" : "recalculated every 20 seconds") + "</span></header><table><tbody>" + rows + "</tbody></table></div>";
}

function viewAuto() {
  const A = DB.automation;
  const row = (k, lab) => '<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)">' +
    '<input type="checkbox" style="width:auto;margin-top:3px" data-auto="' + k + '"' + (A[k] ? " checked" : "") + ">" +
    "<span>" + esc(T(lab)) + "</span></label>";
  return head("a_t", "a_s") +
    '<div class="grid g2" style="margin-bottom:16px">' +
      '<div class="card"><header><h3>' + esc(LANG === "ar" ? "رسائل المرضى" : "Patient messaging") + '</h3></header><div class="body" style="padding-top:0">' +
        row("booking", "auto_booking") + row("checkin", "auto_checkin") + row("delay", "auto_delay") +
        row("next", "auto_next") + row("bill", "auto_bill") + row("noshow", "auto_noshow") +
        '<div class="inline" style="margin-top:14px">' +
          fld(T("a_threshold"), '<input type="number" min="5" max="60" data-auto-n="delayThreshold" value="' + A.delayThreshold + '">') +
          fld(T("a_noshow"), '<input type="number" min="5" max="90" data-auto-n="noShowMinutes" value="' + A.noShowMinutes + '">') +
        "</div></div></div>" +
      '<div class="card"><header><h3>' + esc(LANG === "ar" ? "التأمين والتشغيل" : "Insurance and floor") + '</h3></header><div class="body" style="padding-top:0">' +
        row("kiosk", "auto_kiosk") + row("elig", "auto_elig") + row("appr", "auto_appr") +
        row("claim", "auto_claim") + row("resubmit", "auto_resubmit") +
        '<div class="note" style="margin-top:14px">' + esc(LANG === "ar"
          ? "كل قاعدة موقوفة تعني خطوة يدوية إضافية على الموظف."
          : "Every rule you switch off becomes a step someone has to remember to do.") + "</div>" +
      "</div></div>" +
    "</div>" + boardCard();
}

/* ------------------------- persistence ------------------------- */
const SAVE_KEY = "nabd.state.v2";
let STORE_OK = true;
function save() {
  if (!STORE_OK) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({
    patients: DB.patients, appointments: DB.appointments, visits: DB.visits, claims: DB.claims,
    payments: DB.payments, journal: DB.journal, outbox: DB.outbox, seq: DB.seq, stats: DB.stats,
    automation: DB.automation, gateway: DB.gateway, savedOn: TODAY })); }
  catch (e) { STORE_OK = false; }        /* sandboxed preview — stay in memory */
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const d = JSON.parse(raw); if (!d || !d.patients) return false;
    Object.assign(DB, d); return true;
  } catch (e) { STORE_OK = false; return false; }
}
function resetDemo() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
}

/* ------------------------- wiring ------------------------- */
NAV[0].items.push(["kiosk", "nav_kiosk"]);
NAV.splice(3, 0, { grp: "g_auto", items: [["outbox", "nav_outbox"], ["auto", "nav_auto"]] });

const EXTRA = { kiosk: viewKiosk, outbox: viewOutbox, auto: viewAuto };
const _viewDash = viewDash;
viewDash = function () { return _viewDash() + '<div style="margin-top:16px"></div>' + boardCard(); };
const _render = render;
render = function () {
  if (EXTRA[VIEW.name]) { renderNav(); $("#view").innerHTML = EXTRA[VIEW.name](); }
  else _render();
  save();
};

/* scan straight into the registration form */
const _newPt = newPatientModal;
newPatientModal = function () {
  _newPt();
  const b = document.createElement("div");
  b.innerHTML = '<button class="btn" data-act="scan-open" style="width:100%;margin-bottom:16px">' +
    esc(T("scan_doc")) + '</button><div class="hint" style="margin:-12px 0 16px">' +
    esc(LANG === "ar" ? "يملأ الاسم والجنسية وتاريخ الميلاد والرقم الشخصي تلقائياً."
                      : "Fills name, nationality, date of birth and QID for you.") + "</div>";
  const body = document.querySelector(".modal .body");
  body.insertBefore(b, body.firstChild);
};
function fillRegFromMRZ(m) {
  const set = (id, v) => { const e = $("#" + id); if (e && v) e.value = v; };
  set("f_en", m.fullName); set("f_qid", m.qid); set("f_dob", m.dateOfBirth);
  set("f_nat", E.nationalityName(m.nationality));
  const sx = $("#f_sex"); if (sx && m.sex) sx.value = m.sex;
  const h = $("#qidHint"); if (h && m.qid) { const r = E.validateQID(m.qid);
    h.textContent = r.ok ? "✓ scanned" : r.reason; h.className = r.ok ? "hint" : "err"; }
}

async function captureAndRead() {
  const v = $("#camV"), c = $("#camC"); if (!v || !c) return;
  c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
  const ctx = c.getContext("2d"); ctx.drawImage(v, 0, 0, c.width, c.height);
  /* crop the bottom third — the MRZ always sits there */
  const crop = document.createElement("canvas");
  crop.width = c.width; crop.height = Math.round(c.height * 0.34);
  crop.getContext("2d").drawImage(c, 0, c.height - crop.height, c.width, crop.height, 0, 0, crop.width, crop.height);
  $("#scanOut").innerHTML = '<div class="note" style="margin-top:14px">Reading the strip…</div>';
  try {
    if (!window.Tesseract) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js");
    const r = await window.Tesseract.recognize(crop.toDataURL("image/png"), "eng", {
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<" });
    scanResult(E.parseMRZ(r.data.text));
  } catch (e) {
    $("#scanOut").innerHTML = '<div class="note warn" style="margin-top:14px">On-device OCR is unavailable here. ' +
      'Use the reader input — a document reader types the strip straight into it — or a demo document.</div>';
  }
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  switch (el.dataset.act) {
    case "scan-open": scanModal(m => { fillRegFromMRZ(m); closeModal(); stopCam(); newPatientModal(); fillRegFromMRZ(m); }); break;
    case "scan-mode": stopCam(); scanPane(el.dataset.m); $("#scanOut").innerHTML = ""; $("#scanUse").disabled = true; break;
    case "scan-demo": scanResult(E.parseMRZ(DEMO_DOCS[Number(el.dataset.i)].build().join("\n"))); break;
    case "scan-capture": captureAndRead(); break;
    case "scan-use": { const m = SCAN.parsed, cb = SCAN.onDone; stopCam();
      if (m && cb) { closeModal(); cb(m); } break; }
    case "close-modal": stopCam(); break;
    case "kiosk-scan": scanModal(m => { closeModal(); kioskScan(m); }); break;
    case "kiosk-newfile": {
      const ph = E.validateQatarPhone($("#kioskPhone").value);
      if (!ph.ok) { $("#kioskErr").innerHTML = '<div class="err">' + esc(ph.reason) + "</div>"; break; }
      const p = patientFromMRZ(VIEW.kiosk.mrz, ph.normalised);
      VIEW.kiosk.mrn = p.mrn; VIEW.kiosk.stage = "walkin"; render(); break;
    }
    case "kiosk-walkin": kioskWalkIn(el.dataset.id); break;
    case "kiosk-reset": VIEW.kiosk = { stage: "idle", mrz: null, mrn: null, visitId: null }; render(); break;
    case "send-queued": toast(sendQueued() + (LANG === "ar" ? " رسالة أُرسلت" : " messages sent")); render(); break;
    case "reset-demo": if (confirm(T("reset_demo") + "?")) resetDemo(); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.auto) { DB.automation[el.dataset.auto] = el.checked; runAutomations(); render(); }
  if (el.dataset.autoN) { DB.automation[el.dataset.autoN] = Number(el.value); runAutomations(); render(); }
  if (el.dataset.gw) {
    DB.gateway[el.dataset.gw] = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.gw === "connected" && el.checked) sendQueued();
    render();
  }
});

/* reset control in the top bar */
(function () {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.act = "reset-demo"; b.textContent = "⟲";
  b.title = "Reset demo data";
  $("#langBtn").parentNode.insertBefore(b, $("#langBtn"));
})();

/* ------------------------- boot ------------------------- */
load();
runAutomations();
setInterval(function () {
  runAutomations();
  if (["dash", "queue", "kiosk", "outbox", "auto", "appts"].indexOf(VIEW.name) !== -1) render();
}, 20000);

render();
</script>
</body>
</html>
